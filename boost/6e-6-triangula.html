<style>
#tg-root{position:relative;width:100%;overflow:hidden;background:#050b18;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#eef2ff;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
#tg-root *{box-sizing:border-box}
#tg-stage{position:absolute;top:0;left:0;width:1280px;height:800px;transform-origin:0 0;overflow:hidden}
.tg-ecran{position:absolute;inset:0}
.tg-ecran[hidden]{display:none}
.tg-glass{background:linear-gradient(160deg,rgba(28,40,78,.78),rgba(10,16,36,.84));border:1px solid rgba(255,255,255,.12);box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.10);border-radius:20px}
.tg-serif{font-family:'Lora',Georgia,'Times New Roman',serif}
.tg-cap{text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:700;color:#8fa3cf}
.tg-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#dbe4ff}
.tg-btn{font-family:inherit;cursor:pointer;border:0;border-radius:14px;font-weight:800;font-size:16px;padding:14px 20px;min-height:48px;transition:transform .12s ease,filter .12s ease,box-shadow .12s}
.tg-btn:focus-visible,.tg-opt:focus-visible,.tg-pill:focus-visible,#tg-root [tabindex]:focus-visible{outline:3px solid #46f0ff;outline-offset:3px}
.tg-or{color:#2a1a02;background:linear-gradient(180deg,#ffe29a 0%,#f5bf4f 45%,#d98f1f 100%);box-shadow:0 0 0 1px rgba(255,236,180,.6) inset,0 10px 24px rgba(245,170,50,.30),0 2px 0 #8a5410}
.tg-or:hover{filter:brightness(1.06);transform:translateY(-1px)}
.tg-or:active{transform:translateY(1px)}
.tg-or:disabled{filter:grayscale(.9) brightness(.6);cursor:not-allowed;transform:none}
.tg-ghost{color:#e6ecff;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16)}
.tg-ghost:hover{background:rgba(255,255,255,.12)}
.tg-ghost:disabled{opacity:.45;cursor:not-allowed}
.tg-opt{font-family:inherit;text-align:left;width:100%;cursor:pointer;font-size:14px;font-weight:600;line-height:1.35;color:#e6ecff;padding:11px 14px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);min-height:46px;transition:background .15s,border-color .15s,transform .1s}
.tg-opt:hover:not(:disabled){background:rgba(70,240,255,.10);border-color:rgba(70,240,255,.6)}
.tg-opt:disabled{cursor:default}
.tg-opt.juste{background:rgba(80,220,140,.16);border-color:#5fe39a;color:#fff}
.tg-opt.faux{background:rgba(255,107,91,.12);border-color:#ff6b5b;color:#ffc2b9;animation:tg-shake .35s}
.tg-opt.lettre{text-align:center;font-family:'Lora',Georgia,serif;font-style:italic;font-weight:700;font-size:22px;width:auto;flex:1}
.tg-pill{font-family:inherit;cursor:pointer;min-width:52px;min-height:46px;border-radius:12px;font-weight:800;font-size:18px;color:#e6ecff;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16)}
.tg-pill.on{background:rgba(70,240,255,.16);border-color:#46f0ff;color:#fff;box-shadow:0 0 0 3px rgba(70,240,255,.12)}
@keyframes tg-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.tg-ex{font-size:13.5px;line-height:1.5;color:#c9d3f0;min-height:0}
.tg-ex b{color:#fff}
.tg-ex .ok{color:#7ee2a8;font-weight:800}
.tg-ex .ko{color:#ff9d8f;font-weight:800}
.tg-q{font-size:15px;font-weight:700;line-height:1.4;color:#fff}
#tg-toast{position:absolute;left:454px;top:104px;transform:translate(-50%,-14px);opacity:0;pointer-events:none;padding:11px 22px;border-radius:999px;font-weight:800;font-size:15px;white-space:nowrap;transition:opacity .25s,transform .25s;z-index:30}
#tg-toast.on{opacity:1;transform:translate(-50%,0)}
#tg-toast.ok{background:rgba(28,20,6,.88);color:#ffe7a8;border:1.5px solid #f3b847;box-shadow:0 8px 30px rgba(245,180,70,.25)}
#tg-toast.ko{background:rgba(42,13,16,.9);color:#ffc2b9;border:1.5px solid #ff6b5b}
#tg-toast.info{background:rgba(4,32,44,.9);color:#bff9ff;border:1.5px solid #46f0ff}
#tg-modal{position:absolute;inset:0;z-index:40;display:grid;place-items:center;background:rgba(2,6,16,.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#tg-modal[hidden]{display:none}
#tg-modal .tg-glass{width:520px;padding:32px;text-align:center}
.tg-etoile-big{display:inline-block;margin:0 4px;animation:tg-pop .5s both}
@keyframes tg-pop{0%{transform:scale(.2) rotate(-30deg);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1) rotate(0);opacity:1}}
.tg-plateau{position:absolute;left:24px;top:92px;width:860px;height:684px;border-radius:22px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.08)}
.tg-plateau svg{display:block;width:860px;height:684px;touch-action:none}
.tg-panneau{position:absolute;right:24px;top:92px;width:350px;height:684px;padding:20px;display:flex;flex-direction:column;gap:13px;overflow:hidden}
.tg-pips{display:flex;gap:6px;margin-left:14px}
.tg-pips span{width:22px;height:8px;border-radius:4px;background:rgba(255,255,255,.16)}
.tg-pips span.f{background:linear-gradient(90deg,#f0b43c,#ffe29a)}
.tg-pips span.c{width:34px;background:linear-gradient(90deg,#3de0ef,#8ff6ff)}
.tg-marqueur{cursor:pointer;outline:none}
.tg-marqueur:hover .tg-badge,.tg-marqueur:focus-visible .tg-badge{filter:brightness(1.25)}
.tg-marqueur:focus-visible .tg-etiq{stroke:#46f0ff;stroke-opacity:1}
.tg-pulse{animation:tg-pulse 2.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tg-pulse{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.tg-cible{cursor:pointer}
.tg-trace{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:tg-trace 1s ease forwards}
@keyframes tg-trace{to{stroke-dashoffset:0}}
.tg-apparait{animation:tg-app .5s ease both}
@keyframes tg-app{from{opacity:0}to{opacity:1}}
.tg-carnet-note{position:absolute;left:64px;top:122px;width:780px;padding:16px 20px 16px 64px;border-radius:16px;background:linear-gradient(180deg,#f6ecd6,#eadbbb);color:#3a2a14;box-shadow:0 12px 30px rgba(0,0,0,.4);font-size:17px;line-height:1.45}
.tg-carnet-note b{color:#7a3e10}
.tg-range{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:5px;background:linear-gradient(90deg,#1fb8c9 var(--p),rgba(255,255,255,.1) var(--p));outline:none}
.tg-range::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4,#f3bd45 55%,#b87512);border:2px solid #fff0b8;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4)}

  </div>
  <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)">
    <span style="font-size:12px;color:#8fa3cf;font-weight:600">${e ? 'Ton meilleur score' : 'À gagner'}</span><span style="display:flex;gap:4px">${[0, 1, 2].map((i) => etoileSVG(20, i < e)).join('')}</span></div>
  <button type="button" class="tg-btn tg-or" id="tg-lancer" style="width:100%" ${ouv ? '' : 'disabled'}>${!ouv ? `Termine d’abord la station ${n - 1}` : e ? 'Rejouer ▸' : 'Lancer la mission ▸'}</button>
  <div style="height:1px;background:rgba(255,255,255,.08)"></div>
  <div style="display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="tg-cap">Carnet de bord</span><span style="font-size:11px;color:#8fa3cf">Les notions du chapitre</span></div>
    ${notions.map(([a, v]) => { const [t, c, gr] = lab(v); return `<div style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:#e6ecff"><span>${a}</span><span style="font-size:11px;font-weight:700;color:${c}">${t}</span></div><div style="display:flex;gap:4px">${seg5(v, gr)}</div></div>`; }).join('')}
  </div>`;
  $('#tg-lancer').addEventListener('click', () => ouvrirStation(n));
}

/* ====================== NAVIGATION ====================== */
function ouvrirStation(n) {
  if (!ouverte(n)) return;
  const s = STATIONS[n - 1]; R = { n, def: s.def, manche: 0, erreurs: 0 };
  $('#tg-carte').hidden = true; $('#tg-station').hidden = false;
  $('#tg-st-titre').textContent = s.nom; $('#tg-st-num').textContent = n; lacher($('#tg-plateau'));
  pips(); s.def.debut();
}
function retourCarte() { lacher($('#tg-plateau')); vider(); R = null; $('#tg-station').hidden = true; $('#tg-carte').hidden = false; dessinerCarte(); }
function finStation() {
  if (R.rates) R.erreurs += Math.floor(R.rates / 6);
  const e = R.erreurs <= 1 ? 3 : R.erreurs <= 3 ? 2 : 1; const n = R.n;
  const avant = etoiles(n); save.etoiles[n] = Math.max(avant, e); sauver();
  $('#tg-pips').innerHTML = Array.from({ length: R.def.manches }, () => '<span class="f"></span>').join('');
  const msg = n === 6 ? 'Le phare brille de nouveau sur tout l’archipel. Tu es un vrai cartographe !' : e === 3 ? 'Sans faute (ou presque) : bravo, cartographe !' : e === 2 ? 'Beau travail ! Rejoue plus tard pour décrocher la 3e étoile.' : 'Station terminée ! Rejoue-la pour gagner plus d’étoiles.';
  const suiv = n < 6 ? `<button type="button" class="tg-btn tg-or" id="tg-m-suiv">Station suivante ▸</button>` : '';
  modal(`<div class="tg-cap" style="color:#46f0ff">Station ${n} terminée</div><h2 class="tg-serif" style="font-size:30px;margin:8px 0 14px;color:#fff">${STATIONS[n - 1].nom}</h2>
    <div style="margin:6px 0 14px">${[0, 1, 2].map((i) => `<span class="tg-etoile-big" style="animation-delay:${.15 + i * .2}s">${etoileSVG(64, i < e)}</span>`).join('')}</div>
    <p style="font-size:15px;line-height:1.5;color:#c9d3f0;margin:0 0 22px">${msg}</p>
    <div style="display:flex;gap:10px;justify-content:center">${suiv}<button type="button" class="tg-btn tg-ghost" id="tg-m-carte">Retour à la carte</button><button type="button" class="tg-btn tg-ghost" id="tg-m-rejouer">Rejouer</button></div>`);
  if (suiv) $('#tg-m-suiv').addEventListener('click', () => { fermerModal(); choix = null; ouvrirStation(n + 1); });
  $('#tg-m-carte').addEventListener('click', () => { fermerModal(); choix = n < 6 ? n + 1 : 6; retourCarte(); });
  $('#tg-m-rejouer').addEventListener('click', () => { fermerModal(); ouvrirStation(n); });
}
function intro() {
  modal(`<div class="tg-cap" style="color:#46f0ff">Bienvenue, cartographe</div><h2 class="tg-serif" style="font-size:30px;margin:8px 0 12px;color:#fff">L’archipel de Triangula</h2>
    <p style="font-size:15px;line-height:1.6;color:#c9d3f0;margin:0 0 10px">La carte de l’archipel s’est effacée et le phare s’est éteint. Visite les six îles, maîtrise les triangles et la médiatrice… et rallume le phare !</p>
    <p style="font-size:13px;line-height:1.5;color:#8fa3cf;margin:0 0 22px">Prévois ta règle de tête : ici, tout se mesure au millimètre.</p>
    <button type="button" class="tg-btn tg-or" id="tg-go">C’est parti ▸</button>`);
  $('#tg-go').addEventListener('click', () => { save.intro = true; sauver(); fermerModal(); });
}

/* ====================== DÉMARRAGE ====================== */
function init() {
  charger(); ajuster();
  window.addEventListener('resize', ajuster);
  if ('ResizeObserver' in window) new ResizeObserver(ajuster).observe($('#tg-root'));
  $('#tg-retour').addEventListener('click', retourCarte);
  $('#tg-btn-reset').addEventListener('click', () => {
    modal(`<h2 class="tg-serif" style="font-size:26px;margin:0 0 10px;color:#fff">Recommencer la partie ?</h2><p style="font-size:14.5px;color:#c9d3f0;margin:0 0 20px">Toutes les étoiles gagnées sur cet ordinateur seront effacées.</p>
      <div style="display:flex;gap:10px;justify-content:center"><button type="button" class="tg-btn tg-ghost" id="tg-non">Annuler</button><button type="button" class="tg-btn tg-or" id="tg-oui">Oui, recommencer</button></div>`);
    $('#tg-non').addEventListener('click', fermerModal);
    $('#tg-oui').addEventListener('click', () => { save = { etoiles: {}, intro: true }; sauver(); choix = null; fermerModal(); dessinerCarte(); });
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#tg-modal').hidden && $('#tg-non')) fermerModal(); });
  dessinerCarte();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (!$('#tg-carte').hidden) dessinerCarte(); });
  if (!save.intro) intro();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
window.__triangula = { ouvrirStation, retourCarte, get R() { return R; }, ST3, ST4, ST6, save: () => save }; // pour les tests
})();

</script>
</body>
</html>
